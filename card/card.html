<!doctype html>
<!-- GitHub social preview for thesubtleties/sbtlTV. Render: scripts/render-card.sh -> card/card.png (1280x640) -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Fira Sans'; font-weight: 400; src: url('../node_modules/@fontsource/fira-sans/files/fira-sans-latin-400-normal.woff2'); }
@font-face { font-family: 'Fira Sans'; font-weight: 500; src: url('../node_modules/@fontsource/fira-sans/files/fira-sans-latin-500-normal.woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; background: #0d0d0d; font-family: 'Fira Sans', sans-serif; color: #e8e8e8; }
.bg { position: absolute; inset: -40px; background: url('../public/media/bg-poster.webp') center / cover; filter: blur(26px) saturate(1.3) brightness(0.55); }
.shade { position: absolute; inset: 0; background:
  radial-gradient(50% 60% at 82% 30%, rgb(0 212 255 / 0.10), transparent 70%),
  linear-gradient(90deg, rgb(13 13 13 / 0.85) 0%, rgb(13 13 13 / 0.55) 45%, rgb(13 13 13 / 0.2) 100%); }
.text { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { width: 76px; height: 76px; }
.brand h1 { font-size: 72px; font-weight: 500; letter-spacing: -0.5px; }
.tag { margin-top: 22px; font-size: 28px; line-height: 1.32; }
.meta { margin-top: 26px; font-size: 20px; color: rgb(255 255 255 / 0.6); }
.url { margin-top: 30px; font-size: 22px; font-weight: 500; color: #00d4ff; }
.shot { position: absolute; border-radius: 12px; border: 1px solid rgb(255 255 255 / 0.12); overflow: hidden; }
.shot img { display: block; width: 100%; }
.back { left: 600px; top: 58px; width: 640px; opacity: 0.55; transform: rotate(-2deg); }
.front { left: 640px; top: 168px; width: 700px; box-shadow: 0 30px 90px rgb(0 0 0 / 0.6), 0 0 80px rgb(0 212 255 / 0.15); }
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="shot back"><img src="../src/assets/shots/live.png" alt=""></div>
<div class="shot front"><img src="../src/assets/shots/movies.png" alt=""></div>
<div class="text">
  <div class="brand"><img src="../src/assets/logo.png" alt=""><h1>sbtlTV</h1></div>
  <p class="tag">A clean, simple and smooth IPTV player for live TV, movies and series.</p>
  <p class="meta">Windows · macOS · Linux&nbsp;&nbsp;·&nbsp;&nbsp;Free and open source</p>
  <p class="url">sbtltv.com</p>
</div>
</body></html>
