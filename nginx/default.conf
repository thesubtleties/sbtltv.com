server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Nothing is logged: the site's privacy note promises the lists file never is.
  access_log off;
  # Errors too: a missing file would otherwise log the visitor's address
  log_not_found off;
  error_log /dev/stderr crit;
  etag on;
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml text/plain application/xml;
  include /etc/nginx/security-headers.inc;

  # add_header in a location replaces the server's, so each location includes the headers again
  location = /lists/v1.json {
    default_type application/json;
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=3600" always;
  }
  location = /lists/v1.json.sig {
    default_type text/plain;
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=3600" always;
  }
  location /_astro/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /media/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=86400" always;
  }
  location / {
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404.html;
}
