name: Deploy
on:
  push:
    branches: [main]
    # Changes that can't affect the built site don't rebuild it
    paths-ignore: ['README.md', 'media-src/**', 'card/**', 'scripts/render-card.sh', '.github/workflows/ci.yml', '.github/dependabot.yml']
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *' # hourly: rebuild only when a new sbtlTV release is out or today's lists snapshot isn't live
permissions:
  contents: read
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.d.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, sparse-checkout: lists/snapshots }
      - id: d
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", EVENT: "${{ github.event_name }}" }
        run: |
          if [ "$EVENT" != schedule ]; then echo build=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Build when no image exists yet for the newest release (the package is public)
          latest=$(gh api repos/thesubtleties/sbtlTV/releases/latest -q .tag_name)
          if ! docker manifest inspect "ghcr.io/thesubtleties/sbtltv-web:$latest" >/dev/null 2>&1; then
            echo "no image for $latest yet"; echo build=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ...or when the lists snapshot for today (UTC) is not the one being served (same rule as src/lib/snapshot.ts)
          dates=$(ls lists/snapshots | sed -n 's/^\([0-9-]*\)\.json$/\1/p' | sort)
          pick=$(awk -v t="$(date -u +%F)" '$0<=t{p=$0} END{print p}' <<<"$dates"); [ -n "$pick" ] || pick=$(head -1 <<<"$dates")
          want=$(sha256sum "lists/snapshots/$pick.json" | cut -d' ' -f1)
          live=$(curl -fsS https://sbtltv.com/lists/v1.json | sha256sum | cut -d' ' -f1) || live=unreachable
          if [ "$want" != "$live" ]; then
            echo "lists: serving ${live:0:12}, today's snapshot $pick is ${want:0:12}"; echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "image for $latest exists, lists current ($pick)"; echo build=false >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Only this job can push the image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - id: rel
        run: echo "tag=$(cat dist/version.txt)" >> "$GITHUB_OUTPUT"
      - run: pnpm check-dist
      - run: pnpm check-links
      # Pushed only after every check above passed; a failed build leaves the live image alone
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thesubtleties/sbtltv-web:main
            ghcr.io/thesubtleties/sbtltv-web:${{ steps.rel.outputs.tag }}
            ghcr.io/thesubtleties/sbtltv-web:${{ github.sha }}-${{ steps.rel.outputs.tag }}
